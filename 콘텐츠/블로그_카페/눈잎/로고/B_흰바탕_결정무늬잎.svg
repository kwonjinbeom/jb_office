<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- B: 흰 바탕 + 청록 선 네잎, 잎마다 눈 결정 무늬 -->
  <defs>
    <path id="leaf" d="M256 248 C 231 225, 164 202, 169 144 C 174 101, 227 92, 256 126 C 285 92, 338 101, 343 144 C 348 202, 281 225, 256 248 Z"/>
    <g id="flake" stroke="#2F6F62" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="0" y1="-30" x2="0" y2="30"/>
      <line x1="-26" y1="-15" x2="26" y2="15"/>
