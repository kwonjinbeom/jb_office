<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A: 청록 바탕 + 쌓인 눈처럼 보송한 하얀 네잎 -->
  <defs>
    <radialGradient id="snow" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f3f9fa"/>
      <stop offset="1" stop-color="#cfe6ea"/>
    </radialGradient>
    <filter id="fluffy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="leaf" d="M256 250 C 230 226, 160 202, 165 142 C 170 96, 226 86, 256 122 C 286 86, 342 96, 347 142 C 352 202, 282 226, 256 250 Z"/>
  </defs>
  <rect width="512" height="512" rx="112" fill="#2F6F62"/>
  <!-- 줄기는 잎 뒤에: 두 아래 잎 사이로 나온다 -->
  <path d="M256 256 C 262 330, 282 402, 322 448" fill="none" stroke="#f3f9fa" stroke-width="14" stroke-linecap="round" filter="url(#fluffy)"/>
  <g filter="url(#fluffy)" fill="url(#snow)">
    <use href="#leaf" transform="rotate(45 256 256)"/>
    <use href="#leaf" transform="rotate(135 256 256)"/>
    <use href="#leaf" transform="rotate(225 256 256)"/>
    <use href="#leaf" transform="rotate(315 256 256)"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="96" cy="104" r="6"/><circle cx="420" cy="92" r="5"/><circle cx="438" cy="300" r="4"/>
    <circle cx="80" cy="356" r="5"/><circle cx="150" cy="440" r="4"/><circle cx="400" cy="450" r="6"/>
  </g>
</svg>
