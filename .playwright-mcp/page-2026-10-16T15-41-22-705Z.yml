              - link "(입상)2020년도 KSB 인공지능 프레임워크/플랫폼(BeeAI)활용 공모전 2020년도 KSB 인공지능 프레임워크/플랫폼(BeeAI)활용 공모전 본 KSB 인공지능 공모전은 국가과학기술연구회, KSB융합연구단(한국전자통신연구원,한국에너지기술연구원,한국원자력연구원,한국표준과학연구원) 에서 주최하였으며, 연구단에서 만든 인공지능 플랫폼을 사용하여 서비스를 개발하는 공모전입니다. 개발 내용은 KSB 인공지능 프레임워크 머신러닝 기반 당뇨병 환자를 위한 IOT 영양소 수치 예측 및 반환 기술입니다. 저의 역할은 데이터 정제(Python)와 머신러닝(R), 플랫폼 활용 입니다. 안녕하세요~!~! 오늘은 2020년 8월부터 10월 초까지 준비한 BeeAI공모전에서 제가 공부한 부분을 소개해드리고자 해요. 공모전의 내용은 공개하지 않고 제가 공부한 내용만 담았습니다! 시작하기 앞서 어떤 행.. 더보기" [ref=f4e105] [cursor=pointer]:
