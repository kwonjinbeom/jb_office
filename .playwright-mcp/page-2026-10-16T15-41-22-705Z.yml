              - link "(Capstone Design 2021년)ROS 자율주행 방역 시스템 (Capstone Design 2021년)ROS 자율주행 방역 시스템 본 캡스톤 디자인 공모전은 강원대학교에서 주최하였으며, 캡스톤 디자인(Capstone Design)이란 창의적 종합설계 능력을 갖춘 인재 양성을 목적으로 현장에서 부딪히는 문제해결 능력을 키우기 위해 기획부터 제작까지 일련의 과정을 학생들이 직접 수행하여 진행하는 프로그램입니다.. 개발 내용은 ROS기반 자율주행 방역 시스템 입니다. 저의 역할은 펌웨어 SW , App UI, java 및 서버, 3D printing 입니다. 안녕하세요!! 이번에는 ROS 의 자율주행 프로그램을 이용한 자율 주행 방역 시스템을 만들어보았습니다. 이 작품은 동민이라는 제 동생이자 친구와 3학년 때 캡스톤 디자인 경연에 참가할 때 만든 작품입니다.!! 동민.. 더보기" [ref=f4e79] [cursor=pointer]:
