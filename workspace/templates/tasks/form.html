{% extends "base.html" %}

{% block breadcrumb %}<div class="crumb"><a href="{% url 'tasks:list' %}">할 일</a></div>{% endblock %}

{% block actions %}
{% if task %}<a class="btn ghost danger" href="{% url 'tasks:delete' task.pk %}">{% include "includes/ic.html" with name="trash" %}삭제</a>{% endif %}
<a class="btn" href="{{ next|default:'/tasks/' }}">취소</a>
<button class="btn primary" type="submit" form="main-form">{% include "includes/ic.html" with name="save" %}저장</button>
{% endblock %}

{% block content %}
<form id="main-form" method="post" class="form-page">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <section class="card">
    <div class="card-body form-col">
      {% include "includes/form_fields.html" %}
    </div>
  </section>
  <div class="form-foot">
    <a class="btn" href="{{ next|default:'/tasks/' }}">취소</a>
    <button class="btn primary" type="submit">{% include "includes/ic.html" with name="save" %}저장</button>
  </div>
</form>
{% endblock %}
