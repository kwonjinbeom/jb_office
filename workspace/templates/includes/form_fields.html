{# 공용 폼 렌더링. form 을 받아 보이는 필드를 위에서 아래로 그린다. #}
{% if form.non_field_errors %}<div class="notice danger">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form.visible_fields %}
  {% include "includes/field.html" with field=field %}
{% endfor %}
{% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
