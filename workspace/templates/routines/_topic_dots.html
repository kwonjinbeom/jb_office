{# 고정 주제의 주별 발행 점 (오래된 주 → 이번 주). 누르면 그 주 발행/미발행이 바뀐다. 컨텍스트: t(cells), next #}
<span class="tp-dots">{% for w, done, now in t.cells %}<form method="post" action="{% url 'routines:topic_week' t.pk %}">{% csrf_token %}<input type="hidden" name="week" value="{{ w|date:'Y-m-d' }}"><input type="hidden" name="next" value="{{ next }}"><button class="tp-dot{% if done %} on{% endif %}{% if now %} now{% endif %}" title="{{ w|date:'n/j' }} 주{% if now %} (이번 주){% endif %} · {% if done %}발행함 — 누르면 미발행{% else %}미발행 — 누르면 발행함{% endif %}" aria-label="{{ t.name }} {{ w|date:'n/j' }} 주 {% if done %}발행함{% else %}미발행{% endif %}"></button></form>{% endfor %}</span>
