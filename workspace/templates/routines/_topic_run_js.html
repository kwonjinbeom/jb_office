{% comment %}커스텀 글쓰기 실행 (topics.run): 고른 줄의 편수를 보내 안내문을 받고, 복사해 PC 터미널 claude 를 연다.
   [data-tp-run] = 이 화면에서 체크한 줄 전부 (줄마다 [data-tp-pick] 체크 + [data-tp-n] 편수), [data-tp-one="c12"] = 그 한 줄 1편.{% endcomment %}
<script>
(function () {
  var URL = "{% url 'routines:topic_run' %}", CSRF = "{{ csrf_token }}";
  function launch(btn, pairs) {
    if (!pairs.length) { App.toast("쓸 줄을 체크하세요.", "warn"); return; }
    var fd = new FormData();
    fd.append("csrfmiddlewaretoken", CSRF);
    pairs.forEach(function (p) { fd.append(p[0], p[1]); });
    btn.disabled = true;
    fetch(URL, { method: "POST", body: fd, credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { App.toast(res.j.error || "안내문을 만들지 못했습니다.", "warn"); return; }
        App.rtLaunch(res.j.prompt, { kind: "run", key: res.j.key, day: res.j.day, name: res.j.name,
                                     msg: "PC 터미널에서 claude 가 " + res.j.count + "편까지 씁니다 (글감 없는 줄은 건너뜀)." }, false);
      })
      .catch(function () { App.toast("안내문을 만들지 못했습니다. 다시 눌러 보세요.", "warn"); })
      .then(function () { btn.disabled = false; });
  }
  function picked() {
    var out = [];
    document.querySelectorAll("[data-tp-pick]:checked").forEach(function (box) {
      var n = box.closest("tr").querySelector("[data-tp-n]");
      out.push([box.value, n ? (parseInt(n.value, 10) || 1) : 1]);
    });
    return out;
  }
  function count() {
    var el = document.querySelector("[data-tp-count]");
    if (!el) return;
    var p = picked(), sum = p.reduce(function (a, x) { return a + x[1]; }, 0);
    el.textContent = p.length ? p.length + "줄 · " + sum + "편" : "줄 앞을 체크하세요";
  }
  document.addEventListener("click", function (e) {
    var all = e.target.closest("[data-tp-run]");
    if (all) { launch(all, picked()); return; }
    var one = e.target.closest("[data-tp-one]");
    if (one) launch(one, [[one.dataset.tpOne, 1]]);
  });
  document.addEventListener("change", function (e) {
    var site = e.target.closest("[data-tp-site]");
    if (site) document.querySelectorAll('[data-tp-pick][data-site="' + site.dataset.tpSite + '"]').forEach(function (b) { b.checked = site.checked; });
    count();
  });
  document.addEventListener("input", function (e) { if (e.target.closest("[data-tp-n]")) count(); });
  count();
})();
</script>
