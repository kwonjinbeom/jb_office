{# 로컬 실행: 안내문을 클립보드에 복사하고 jbroutine: 링크로 PC 에서 claude 터미널을 연다 (static/js/app.js, apps/routines/local_run.py). PC 서버가 꺼져 있어도 된다. PC 화면이면 조금 뒤 새로고침. #}
<form class="rt-launch"{% if not on_server %} data-reload{% endif %}><input type="hidden" name="key" value="{{ key }}"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="kind" value="{{ kind }}">{% if keys %}<input type="hidden" name="keys" value="{{ keys }}">{% endif %}<input type="hidden" name="day" value="{{ day|date:'Y-m-d' }}"><input type="hidden" name="prompt" value="{{ text }}"><button class="btn sm{% if primary %} primary{% endif %}" type="submit" title="PC 에서 새 터미널로 claude 시작 (처음 한 번 workspace\run.bat 또는 routine_link.bat 로 등록)">{% include "includes/ic.html" with name="server" %}{{ label }}</button></form>
