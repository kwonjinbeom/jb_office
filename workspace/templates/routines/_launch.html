{# 로컬 실행: 안내문을 PC 서버의 launch 로 보낸다. 실서버 화면이면 새 탭으로 PC 서버가 열린다. #}
<form class="rt-launch" method="post" action="{{ launch_action }}"{% if on_server %} target="_blank"{% endif %}>{% if not on_server %}{% csrf_token %}{% endif %}<input type="hidden" name="key" value="{{ key }}"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="kind" value="{{ kind }}">{% if keys %}<input type="hidden" name="keys" value="{{ keys }}">{% endif %}<input type="hidden" name="day" value="{{ day|date:'Y-m-d' }}"><input type="hidden" name="prompt" value="{{ text }}"><button class="btn sm{% if primary %} primary{% endif %}" type="submit" title="PC 에서 새 터미널로 claude 시작{% if on_server %} (PC 서버가 켜져 있어야 합니다){% endif %}">{% include "includes/ic.html" with name="server" %}{{ label }}</button></form>
