{% extends "base.html" %}
{# 공용 삭제 확인. 컨텍스트: page_title, object_label, cancel_url, (선택) hint #}
{% block content %}
<div class="card card--narrow">
  <h2>정말 삭제할까요?</h2>
  <p><strong>{{ object_label }}</strong> 을(를) 삭제합니다. 되돌릴 수 없습니다.</p>
  {% if hint %}<p class="muted small">{{ hint }}</p>{% endif %}
  <form method="post" class="form__footer">
    {% csrf_token %}
    <a class="btn" href="{{ cancel_url }}">취소</a>
    <button class="btn btn--danger" type="submit">삭제</button>
  </form>
</div>
{% endblock %}
