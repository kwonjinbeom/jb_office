{% extends "base.html" %}
{# 공용 삭제 확인. 컨텍스트: page_title, object_label, cancel_url, (선택) hint #}
{% block content %}
<div class="confirm">
  <div class="confirm-head">{% include "includes/ic.html" with name="alert" %}정말 삭제할까요?</div>
  <div class="confirm-body">
    <p><strong>{{ object_label }}</strong> 을(를) 삭제합니다. 되돌릴 수 없습니다.</p>
    {% if hint %}<p class="muted small">{{ hint }}</p>{% endif %}
  </div>
  <form method="post" class="confirm-foot">
    {% csrf_token %}
    <a class="btn" href="{{ cancel_url }}">취소</a>
    <button class="btn danger solid" type="submit">{% include "includes/ic.html" with name="trash" %}삭제</button>
  </form>
</div>
{% endblock %}
