<script>
/* 카테고리 수정 (2026-10-22 사용자): 누르면 넣은 카테고리가 고르기로 바뀐다. 하나 바꾼 뒤에도(새로 고침) 계속 수정 중 — 다시 누르면 끝 */
(function () {
  var btn = document.querySelector("[data-cat-edit]");
  if (!btn) return;
  var grid = document.querySelector(".ph-main");  // 두 표 모두
  function set(on) {
    grid.classList.toggle("cat-editing", on);
    btn.classList.toggle("primary", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    try { on ? sessionStorage.setItem("posts.catEdit", "1") : sessionStorage.removeItem("posts.catEdit"); } catch (e) {}
  }
  try { if (sessionStorage.getItem("posts.catEdit") === "1") set(true); } catch (e) {}
  btn.addEventListener("click", function () { set(!grid.classList.contains("cat-editing")); });
})();
</script>
