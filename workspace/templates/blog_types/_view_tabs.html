{# 글 보기의 단계 탭: 임시글 → 검토글 → 발행예정글. 누르면 그 단계 목록의 첫 글 (분류·검색·오늘 조건은 그대로). 컨텍스트: pl_tabs #}
<nav class="wr-tabs" aria-label="글 단계">
