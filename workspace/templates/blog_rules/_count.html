<form class="br-count" method="post" action="{% url 'blog_rules:count' %}">{% csrf_token %}<input type="hidden" name="blog" value="{{ b.pk }}"><input type="hidden" name="day" value="{{ day|date:'Y-m-d' }}"><input type="hidden" name="field" value="{{ field }}"><input type="hidden" name="keep" value="{{ keep }}"><input class="num-in{% if fixed %} is-fixed{% endif %}" type="number" name="value" min="0" max="999" value="{{ value }}" placeholder="{{ auto }}" data-autosubmit title="{% if fixed %}고친 값 (자동 {{ auto }}) — 비우면 자동{% else %}자동으로 센 값 — 고치면 그날 값으로 남음{% endif %}" aria-label="{{ b.name }} {{ label }}"></form>
