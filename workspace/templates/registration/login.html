{% load static %}<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 작업서버</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand"><span class="brand__mark">WS</span><span class="brand__text">작업서버</span></div>
    {% if form.errors %}<div class="flash flash--error" style="margin-bottom:14px">아이디 또는 비밀번호가 맞지 않습니다.</div>{% endif %}
    {% if next and not form.errors %}<div class="flash flash--info" style="margin-bottom:14px">계속하려면 로그인하세요.</div>{% endif %}
    <form method="post" class="form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="id_username">아이디</label>
        <input class="input" type="text" name="username" id="id_username" autofocus autocomplete="username" required>
      </div>
      <div class="field">
        <label for="id_password">비밀번호</label>
        <input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary" type="submit" style="width:100%;justify-content:center">로그인</button>
    </form>
  </div>
</body>
</html>
