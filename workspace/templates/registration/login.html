{% load static %}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · JB Office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6bd8'/%3E%3Ctext x='16' y='21.5' font-family='Arial' font-weight='700' font-size='14' fill='white' text-anchor='middle'%3EJB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ ASSET_VER }}">
</head>
<body class="login-page">
  <form method="post" class="login-card">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="brand"><span class="brand-mark">JB</span><span class="brand-text">Office</span></div>
    {% if form.errors %}<div class="notice danger">아이디 또는 비밀번호가 맞지 않습니다.</div>{% endif %}
    {% if next and not form.errors %}<div class="notice info">계속하려면 로그인하세요.</div>{% endif %}
    <div class="field">
      <label for="id_username">아이디</label>
      <input class="input" type="text" name="username" id="id_username" autofocus autocomplete="username" required>
    </div>
    <div class="field">
      <label for="id_password">비밀번호</label>
      <input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <button class="btn primary lg block" type="submit">로그인</button>
  </form>
</body>
</html>
