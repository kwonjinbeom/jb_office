{# 목록에서 바로 바꾸는 상태 버튼. 컨텍스트: post, field, current, choices, next(돌아갈 주소, 없으면 지금 주소) #}
<form method="post" action="{% url 'naver_writing:status' post.pk %}" class="status-seg">{% csrf_token %}
  <input type="hidden" name="field" value="{{ field }}"><input type="hidden" name="next" value="{{ next|default:request.get_full_path }}">
  {% for value, label in choices %}<button name="value" value="{{ value }}" {% if value == current %}class="on" disabled{% endif %}>{{ label }}</button>{% endfor %}
</form>
